[workspace]
members = [
    "crates/collection",
    "crates/environment",
    "crates/keybindings_service",
    "crates/theme",
    "crates/updater",
    "crates/workspace",
    "crates/request-eagle",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
gpui-kit = { version = "=0.6.0", default-features = false }
# Match GPUI Kit's HTTP client version to keep the GPUI HTTP traits compatible.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.1" }
thiserror = "2"
